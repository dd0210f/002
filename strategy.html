<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --success-light: rgba(34, 197, 94, 0.1);
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.1);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.1);
            --border: #334155;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 16px;
            min-width: 400px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Cards */
        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Forms */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-warning {
            background-color: var(--warning);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }

        .status-warning {
            background-color: var(--warning-light);
            color: var(--warning);
        }

        /* Custom Strategy UI */
        .pair-row {
            display: grid;
            grid-template-columns: 2fr 1.5fr auto;
            gap: 10px;
            align-items: end;
            margin-bottom: 12px;
            padding: 12px;
            background-color: var(--bg-body);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .pair-row:last-child {
            margin-bottom: 0;
        }

        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            text-align: left;
            color: var(--text-muted);
            font-weight: 500;
            padding: 8px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .text-green {
            color: var(--success);
        }

        .text-red {
            color: var(--danger);
        }

        .text-muted {
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-running {
            background-color: var(--success-light);
            color: var(--success);
        }

        .status-idle {
            background-color: var(--bg-input);
            color: var(--text-muted);
        }

        .status-error {
            background-color: var(--danger-light);
            color: var(--danger);
        }

        .imbalance-warning {
            background-color: var(--warning-light);
            color: var(--warning);
            padding: 10px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <!-- Configuration Card -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">策略配置</span>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn btn-outline btn-sm" id="refresh-markets-btn">🔄 刷新市场</button>
                <div class="form-group" style="margin-bottom: 0; width: 140px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="margin: 0; white-space: nowrap;">翻转(分)</label>
                        <input type="number" id="flip-interval" value="60" min="1" style="padding: 4px 8px;">
                    </div>
                </div>
            </div>
        </div>

        <div id="pairs-container">
            <!-- Pair rows will be added here -->
        </div>

        <datalist id="pair-suggestions"></datalist>

        <button class="btn btn-outline" id="add-pair-btn" style="margin-top: 12px;">+ 添加交易对</button>

        <div class="control-buttons">
            <button class="btn btn-primary" id="start-strategy-btn">启动策略</button>
            <button class="btn btn-warning" id="stop-strategy-btn" style="display:none;">停止策略</button>
            <button class="btn btn-danger" id="close-all-btn">一键平仓</button>
        </div>

        <div id="imbalance-warning" class="imbalance-warning" style="display:none;">
            ⚠️ 检测到仓位不平衡，正在自动处理...
        </div>
    </div>

    <!-- Positions Card -->
    <div class="card" style="margin-bottom: 0;">
        <div class="card-header">
            <span class="card-title">持仓监控</span>
        </div>

        <div id="positions-content" class="table-container">
            <div class="empty-state">暂无活跃策略</div>
        </div>
    </div>

    <script src="strategy.js"></script>
</body>

</html>
